line-length = 88
preview = true
target-version = "py314"

# The portable layer is copied as is from the author's other repositories.
extend-exclude = [".agents"]

[lint]
extend-select = ["unused-async"]
fixable = ["ALL"]
select = [
  "E",
  "F",
  "UP",
  "B",
  "I",
  "SIM",
  "S",
  "RUF",
  "PTH",
  "C4",
  "ARG",
  "G",
  "ANN",
]

[lint.per-file-ignores]
"tests/**/*.py" = [
  "assert",
  "suspicious-subprocess-import",
  "subprocess-without-shell-equals-true",
]
# A law is arbitrary code the person writes and the loader runs: that is the feature.
"src/emitter_optimizer/engine/laws.py" = ["exec-builtin"]
