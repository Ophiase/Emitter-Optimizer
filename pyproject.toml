[project]
name = "emitter-optimizer"
version = "2.3.0"
description = "Optimize the positions of emitters over a weighted, obstructed map."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
authors = [{ name = "Ophiase" }]
keywords = [
  "coverage",
  "emitters",
  "gradient-descent",
  "optimization",
  "simulation",
]
classifiers = [
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Typing :: Typed",
]
dependencies = [
  "dearpygui>=2.3.1",
  "fastapi>=0.135",
  "jax>=0.12",
  "numpy>=2.5.4",
  "optax>=0.2.8",
  "pillow>=13.0.0",
  "plotly>=7.1.0",
  "pydantic>=2.13",
  "pydantic-settings>=2.13",
  "scikit-image>=0.26.0",
  "uvicorn>=0.41",
]

[project.scripts]
emitter-optimizer = "emitter_optimizer.__main__:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/emitter_optimizer"]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "pytest>=9.1.1",
  "ruff>=0.15.14",
  "ty>=0.0.39",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["--strict-markers", "--strict-config"]
