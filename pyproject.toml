[project]
name = "emitter-optimizer"
version = "2.0.0"
description = "Optimize the positions of emitters over a weighted, obstructed map."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
authors = [{ name = "Ophiase" }]
keywords = [
  "coverage",
  "emitters",
  "gradient-descent",
  "optimization",
  "simulation",
]
classifiers = [
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Typing :: Typed",
]
dependencies = [
  "dearpygui>=2.3.1",
  "matplotlib>=3.11.2",
  "numpy>=2.5.4",
  "opencv-python>=5.0.0.93",
  "pillow>=13.0.0",
]

[project.scripts]
emitter-optimizer = "emitter_optimizer.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/emitter_optimizer"]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.15.14",
  "ty>=0.0.39",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers", "--strict-config"]
